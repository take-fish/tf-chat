spring:
  application:
    name: tf-chat
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
  datasource:
    url: jdbc:h2:mem:fm_chat;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:schema-h2.sql
  flyway:
    enabled: false
  data:
    redis:
      host: 127.0.0.1
      port: 6379

app:
  chat:
    relay-enabled: false
    user-service-url: http://127.0.0.1:9
    image-dir: target/chat-images
