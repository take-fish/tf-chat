spring:
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:false}
  application:
    name: tf-chat
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:20s}
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:10.28.13.214:8848}
      discovery:
        namespace: ${NACOS_NAMESPACE:fm-prod}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}
        fail-fast: false
        metadata:
          version: ${APP_VERSION:dev}
          git-commit: ${GIT_COMMIT:unknown}
      config:
        namespace: ${NACOS_NAMESPACE:fm-prod}
        group: FM
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}
        file-extension: yaml
        import-check:
          enabled: false
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:10.28.13.214}:${MYSQL_PORT:3306}/${MYSQL_DB:fm_chat}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_APP_USER:fm_chat_app}
    password: ${MYSQL_APP_PASSWORD:}
  sql:
    init:
      mode: ${SQL_INIT_MODE:never}
      encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 8MB
  data:
    redis:
      host: ${REDIS_HOST:10.28.13.214}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}

server:
  port: 8102
  shutdown: graceful

app:
  # 运行环境标识：统一 JSON 日志的 env 字段来源；生产/测试栈分别注入 production/test
  environment: ${APP_ENV:production}
  version: ${APP_VERSION:dev}
  chat:
    relay-enabled: ${CHAT_RELAY_ENABLED:true}
    presence-ttl-ms: ${CHAT_PRESENCE_TTL_MS:60000}
    history-limit: 1000
    dm-history-limit: 500
    offline-limit: 200
    max-content-length: 2000
    max-nickname-length: 32
    ws-ticket-ttl-seconds: ${CHAT_WS_TICKET_TTL_SECONDS:60}
    recall-window-seconds: ${CHAT_RECALL_WINDOW_SECONDS:120}
    rate-limit-per-10s: ${CHAT_RATE_LIMIT_PER_10S:20}
    allowed-origins: ${CHAT_ALLOWED_ORIGINS:*}
    image-dir: ${CHAT_IMAGE_DIR:./data/chat-images}
    max-image-bytes: ${CHAT_MAX_IMAGE_BYTES:5242880}
    max-group-image-bytes: ${CHAT_MAX_GROUP_IMAGE_BYTES:1048576}

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0
    propagation:
      type: W3C
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

fm:
  auth:
    enabled: ${FM_AUTH_ENABLED:true}
    user-service-url: ${TF_USER_URL:http://127.0.0.1:8101}
    identity-secret: ${FM_IDENTITY_SECRET:}
    allow-bearer-fallback: ${FM_AUTH_BEARER_FALLBACK:true}
    cache-ttl: ${FM_AUTH_CACHE_TTL:30s}
    public-paths:
      - /api/v1/chat/health
      - /api/v1/chat/meta
  common:
    error:
      service-unavailable-code: CHAT_UNAVAILABLE
      service-unavailable-message: 消息通道暂不可用
